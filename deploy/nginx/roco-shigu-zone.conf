# roco.shigu.zone（洛克王国世界 PVP 决策辅助工具）反代到本机 127.0.0.1:18488。
# 由 scripts/release.ps1 同步到服务器 /etc/nginx/conf.d/roco-shigu-zone.conf。
# 证书用 certbot（nginx 认证器，HTTP-01）单独签发：
#   sudo certbot --nginx -d roco.shigu.zone --redirect --keep-until-expiring
# 签发后 certbot 会往本文件写入 listen 443 ssl / ssl_certificate 等指令（并纳入自动续期）。
server {
    listen 80;
    server_name roco.shigu.zone;

    # certbot HTTP-01 挑战目录（webroot 放在 /var/www/html）
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass http://127.0.0.1:18488;
        proxy_http_version 1.1;
        # 引擎推演 + 观战 SSE 长连接：关缓冲、放宽超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        client_max_body_size 50m;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

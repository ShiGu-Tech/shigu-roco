[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roco-engine"
version = "0.1.0"
description = "洛克王国世界 PVP 决策辅助引擎（模拟器 + MCTS + 贝叶斯对手模型）"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
roco-engine = "roco_engine.cli:main"

[tool.setuptools.packages.find]
include = ["roco_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
